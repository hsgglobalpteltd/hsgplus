<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" id="hsg-meta-theme-color" content="#E4E4E7" />
    <script>
      (function () {
        try {
          var c1 = localStorage.getItem('hsg_theme_color_1');
          var c2 = localStorage.getItem('hsg_theme_color_2');
          if (c1) {
            document.documentElement.style.setProperty('--hsg-color-1', c1);
            var m = document.getElementById('hsg-meta-theme-color');
            if (m) m.setAttribute('content', c1);
          }
          if (c2) {
            document.documentElement.style.setProperty('--hsg-color-2', c2);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
